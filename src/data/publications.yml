# Publications on /about/. The list is made automatically from your Zotero
# export (src/bibliography.json): every item with you as an author is shown,
# newest first, sorted by type into papers, preprints, theses and software.
# A preprint with the same title as a published paper is folded into it as an
# arXiv link. So adding a paper to Zotero is all it takes.
#
# This file only holds exceptions. Items are named by DOI or by
# "arXiv:NNNN.NNNNN", which don't change when Zotero renames citation keys.
# The build warns if an entry here no longer matches anything.

# Items to leave off the list.
exclude:
  - arXiv:1205.3350 # Rekier & Füzfa 2012, Cosmic acceleration with cosmological soft phonons (preprint)
  - 10.1088/1742-6596/600/1/012062 # Rekier et al. 2015, Spherically symmetric solutions… (J. Phys. Conf. Ser.)

# Preprints published under a different title: preprint -> published paper.
published:
  arXiv:2507.01671: 10.1029/2026JB034733 # Constraints on Earth's CMB from nutation -> Nutation damping… (JGR 2026)

# arXiv links for papers whose preprint is not in Zotero.
arxiv:
  10.3847/PSJ/ab93c8: "2004.08218" # Rekier et al. 2020
  10.1029/2019JE005988: "1904.02487" # Rekier et al. 2019, Enceladus
  10.1093/gji/ggz212: "1904.11837" # Triana et al. 2019
  10.1093/gji/ggy465: "1904.05221" # Rekier et al. 2019, GJI
  10.1103/PhysRevD.93.043533: "1509.08354" # Rekier et al. 2016
  10.1103/PhysRevD.91.024025: "1409.3476" # Rekier et al. 2015
  10.1103/PhysRevD.90.083527: "1407.1984" # Clesse & Rekier 2014
